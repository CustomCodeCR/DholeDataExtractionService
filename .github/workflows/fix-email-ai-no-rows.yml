name: Apply email AI no-rows recovery fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-email-ai-no-rows.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch email failure handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          handler = Path('src/Dhole.DataExtraction.Workers/Streams/AiPricingEmailAnalysisFailedStreamHandler.cs')
          text = handler.read_text(encoding='utf-8')

          text = text.replace('using System.Data;\n', 'using System.Data;\nusing System.Net;\n', 1)
          text = text.replace(
              'using Dhole.DataExtraction.Contracts.AsyncEmail;\nusing Dhole.DataExtraction.Domain.Emails.Enums;\n',
              'using Dhole.DataExtraction.Contracts.AsyncEmail;\nusing Dhole.DataExtraction.Domain.Emails;\nusing Dhole.DataExtraction.Domain.Emails.Enums;\n',
              1,
          )

          old = '''        var reason =
              "La normalización asistida por AI no pudo completarse y DataExtraction tampoco produjo filas utilizables: "
              + integrationEvent.ErrorMessage;
          job.MarkFailed(
              job.ExtractionExecutionId,
              integrationEvent.ErrorCode,
              reason
          );
'''
          new = '''        var normalizedAiMessage = NormalizeErrorMessage(integrationEvent.ErrorMessage);
          var isUnsupportedAttachment =
              attachment is not null
              && !EmailAttachmentExtractionPolicy.IsSupported(attachment);
          var isNoPricingRows = string.Equals(
              integrationEvent.ErrorCode,
              "AI.NoPricingRows",
              StringComparison.OrdinalIgnoreCase
          );

          if (isUnsupportedAttachment)
          {
              job.MarkIgnored(
                  $"El adjunto se omitió porque DataExtraction solo procesa {EmailAttachmentExtractionPolicy.SupportedTypesDescription}; las imágenes y otros formatos únicamente se almacenan."
              );
          }
          else if (isNoPricingRows)
          {
              var hasSuccessfulSibling = await dbContext.EmailExtractionJobs
                  .AsNoTracking()
                  .AnyAsync(item =>
                      item.EmailMessageId == job.EmailMessageId
                      && item.Id != job.Id
                      && !item.IsDeleted
                      && item.Status == EmailExtractionJobStatus.SentToPricing,
                      cancellationToken
                  );

              if (hasSuccessfulSibling)
              {
                  job.MarkIgnored(
                      "El contenido no produjo filas tarifarias adicionales y se omitió porque otro contenido de este correo ya fue enviado a Pricing."
                  );
              }
              else
              {
                  job.MarkNeedsReview(
                      job.ExtractionExecutionId,
                      payload.PreviousConfidence,
                      "AI no encontró filas tarifarias utilizables y DataExtraction tampoco produjo una matriz determinística. Revise este contenido antes de descartarlo.",
                      integrationEvent.ErrorCode
                  );
              }
          }
          else
          {
              var reason =
                  "La normalización asistida por AI no pudo completarse y DataExtraction tampoco produjo filas utilizables: "
                  + normalizedAiMessage;
              job.MarkFailed(
                  job.ExtractionExecutionId,
                  integrationEvent.ErrorCode,
                  reason
              );
          }
'''
          assert old in text, 'AI failure terminal block changed unexpectedly'
          text = text.replace(old, new, 1)

          marker = '''    private static bool IsReviewablePricingIssue(string code)
          {
'''
          helper = '''    private static string NormalizeErrorMessage(string? value)
          {
              var decoded = WebUtility.HtmlDecode(value ?? string.Empty);
              var normalized = string.Join(
                  ' ',
                  decoded.Split((char[]?)null, StringSplitOptions.RemoveEmptyEntries)
              );

              return string.IsNullOrWhiteSpace(normalized)
                  ? "AI no devolvió un detalle adicional."
                  : normalized;
          }

          private static bool IsReviewablePricingIssue(string code)
          {
'''
          assert marker in text, 'handler helper marker changed unexpectedly'
          text = text.replace(marker, helper, 1)
          handler.write_text(text, encoding='utf-8')

          worker = Path('src/Dhole.DataExtraction.Workers/Workers/EmailExtractionWorker.cs')
          wtext = worker.read_text(encoding='utf-8')
          old_calls = '''        await RecoverStaleJobsAsync(cancellationToken);
          await RecoverUnsupportedAttachmentJobsAsync(cancellationToken);
          await RecoverRedundantBodyJobsAsync(cancellationToken);
          await RecoverPayloadUrlRejectedJobsAsync(cancellationToken);
'''
          new_calls = '''        await RecoverStaleJobsAsync(cancellationToken);
          await RecoverUnsupportedAttachmentJobsAsync(cancellationToken);
          await RecoverRedundantNoPricingRowsJobsAsync(cancellationToken);
          await RecoverRedundantBodyJobsAsync(cancellationToken);
          await RecoverPayloadUrlRejectedJobsAsync(cancellationToken);
'''
          assert old_calls in wtext, 'worker recovery call list changed unexpectedly'
          wtext = wtext.replace(old_calls, new_calls, 1)

          marker = '''    private async Task RecoverRedundantBodyJobsAsync(
              CancellationToken cancellationToken
          )
'''
          method = '''    private async Task RecoverRedundantNoPricingRowsJobsAsync(
              CancellationToken cancellationToken
          )
          {
              var candidates = await dbContext.EmailExtractionJobs
                  .Where(job =>
                      !job.IsDeleted
                      && (job.Status == EmailExtractionJobStatus.Failed
                          || job.Status == EmailExtractionJobStatus.NeedsReview)
                      && (
                          job.LastErrorCode == "AI.NoPricingRows"
                          || (job.ErrorMessage != null
                              && job.ErrorMessage.Contains(
                                  "AI no encontró filas de tarifas utilizables"
                              ))
                      )
                      && dbContext.EmailExtractionJobs.Any(sibling =>
                          !sibling.IsDeleted
                          && sibling.EmailMessageId == job.EmailMessageId
                          && sibling.Id != job.Id
                          && sibling.Status == EmailExtractionJobStatus.SentToPricing
                      )
                  )
                  .OrderBy(job => job.CreatedAtUtc)
                  .Take(250)
                  .ToListAsync(cancellationToken);

              if (candidates.Count == 0)
              {
                  return;
              }

              var messageIds = new HashSet<Guid>();
              foreach (var job in candidates)
              {
                  job.MarkIgnored(
                      "El contenido no produjo filas tarifarias adicionales y se archivó porque otro contenido del mismo correo ya fue enviado a Pricing."
                  );
                  messageIds.Add(job.EmailMessageId);
              }

              foreach (var messageId in messageIds)
              {
                  await EmailJobStateCoordinator.RecalculateAsync(
                      dbContext,
                      messageId,
                      cancellationToken
                  );
              }

              await dbContext.SaveChangesAsync(cancellationToken);
              logger.LogInformation(
                  "Se archivaron {JobCount} fallos AI.NoPricingRows redundantes de correos que ya tenían contenido enviado a Pricing.",
                  candidates.Count
              );
          }

          private async Task RecoverRedundantBodyJobsAsync(
              CancellationToken cancellationToken
          )
'''
          assert marker in wtext, 'worker recovery method marker changed unexpectedly'
          wtext = wtext.replace(marker, method, 1)
          worker.write_text(wtext, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-email-ai-no-rows.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(email): recover redundant AI no-row failures"
          git push
