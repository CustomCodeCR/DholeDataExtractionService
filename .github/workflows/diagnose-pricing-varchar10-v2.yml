name: Diagnose Pricing Extraction Varchar10 V2

on:
  push:
    branches: [fix/pricing-extraction-varchar10-20260828]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production schemas and recent 22001 errors
        shell: bash
        run: |
          set -euo pipefail

          read_env() {
            local key="$1"
            local value
            value="$(grep -m1 "^${key}=" /opt/dhole/.env | cut -d= -f2- || true)"
            value="${value%$'\r'}"
            if [[ "$value" == \"*\" && "$value" == *\" ]]; then
              value="${value:1:${#value}-2}"
            elif [[ "$value" == \'*\' && "$value" == *\' ]]; then
              value="${value:1:${#value}-2}"
            fi
            printf '%s' "$value"
          }

          POSTGRES_USER="$(read_env POSTGRES_USER)"
          POSTGRES_USER="${POSTGRES_USER:-postgres}"
          POSTGRES_CONTAINER="$(docker ps --format '{{.Names}}|{{.Image}}' | awk -F'|' 'tolower($2) ~ /postgres/ {print $1; exit}')"
          if [[ -z "$POSTGRES_CONTAINER" ]]; then
            echo 'No running PostgreSQL container found.'
            docker ps --format '{{.Names}} {{.Image}}'
            exit 1
          fi
          echo "PostgreSQL container: $POSTGRES_CONTAINER"

          mapfile -t DBS < <(
            docker exec "$POSTGRES_CONTAINER" psql -U "$POSTGRES_USER" -d postgres -Atc \
              "select datname from pg_database where datallowconn and not datistemplate order by datname;"
          )

          echo '=== TARGET DATABASES AND SMALL VARCHAR COLUMNS ==='
          for db in "${DBS[@]}"; do
            schemas="$(docker exec "$POSTGRES_CONTAINER" psql -U "$POSTGRES_USER" -d "$db" -Atc \
              "select schema_name from information_schema.schemata where schema_name in ('data_extraction','pricing') order by schema_name;" || true)"
            [[ -z "$schemas" ]] && continue
            echo "DB=$db schemas=$(echo "$schemas" | tr '\n' ',')"
            docker exec "$POSTGRES_CONTAINER" psql -U "$POSTGRES_USER" -d "$db" -P pager=off -c \
              "select table_schema, table_name, column_name, data_type, character_maximum_length from information_schema.columns where table_schema in ('data_extraction','pricing') and data_type='character varying' and character_maximum_length <= 20 order by table_schema, table_name, column_name;"
            for schema in data_extraction pricing; do
              if echo "$schemas" | grep -qx "$schema"; then
                echo "--- migrations: $db / $schema ---"
                docker exec "$POSTGRES_CONTAINER" psql -U "$POSTGRES_USER" -d "$db" -P pager=off -c \
                  "select \"MigrationId\" from \"$schema\".\"__EFMigrationsHistory\" order by \"MigrationId\" desc limit 18;" || true
              fi
            done
          done

          echo '=== RECENT DATA EXTRACTION 22001 ==='
          for container in dhole-dataextraction-api-1 dhole-dataextraction-workers-1; do
            echo "--- $container ---"
            docker logs --since 6h "$container" 2>&1 | grep -C 18 -E '22001|value too long|classification|clasific' | tail -n 420 || true
          done
