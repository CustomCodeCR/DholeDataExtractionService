name: Deploy Dhole DataExtraction - Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: dhole-dataextraction-staging
  cancel-in-progress: true
env:
  COMPOSE_FILE: .dhole-system/deploy/docker-compose.services.yml
  COMPOSE_OVERRIDE: .dhole-system/deploy/docker-compose.staging.yml
  DHOLE_IMAGE_TAG: staging
  DHOLE_NETWORK: dhole-staging
  COMPOSE_PROJECT: dhole-staging
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Load Dhole deployment infrastructure
        run: |
          set -euo pipefail
          rm -rf .dhole-system
          git clone --depth 1 --branch master https://github.com/CustomCodeCR/DholeSystem.git .dhole-system
          mkdir -p "$RUNNER_TEMP/dhole-env"
          bash .dhole-system/deploy/prepare-environments.sh /opt/dhole/.env "$RUNNER_TEMP/dhole-env"
          echo "DHOLE_ENV_FILE=$RUNNER_TEMP/dhole-env/.env.staging" >> "$GITHUB_ENV"
      - name: Verify staging server
        run: docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" config -q
      - name: Build API and Workers together (shared BuildKit cache)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          START=$(date +%s)
          export GITHUB_ACTOR IMAGE_TAG="$DHOLE_IMAGE_TAG"
          if [ "$IMAGE_TAG" = "latest" ]; then
            export SHA_TAG="${GITHUB_SHA::12}"
          else
            export SHA_TAG="${IMAGE_TAG}-${GITHUB_SHA::12}"
          fi
          if docker buildx version >/dev/null 2>&1; then
            # BuildKit executes both final targets together and shares NuGet restore,
            # OCR runtime apt dependencies and cached project compilation layers.
            docker buildx bake -f .github/docker-bake.hcl --progress=plain
          else
            # Compatible fallback for runners where the Buildx CLI plugin is absent.
            docker build --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" \
              --secret id=github_token,env=GITHUB_TOKEN \
              -f .github/docker/Dockerfile --target api \
              -t "dhole/dataextraction-api:$IMAGE_TAG" \
              -t "dhole/dataextraction-api:$SHA_TAG" .
            docker build --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" \
              --secret id=github_token,env=GITHUB_TOKEN \
              -f .github/docker/Dockerfile --target workers \
              -t "dhole/dataextraction-workers:$IMAGE_TAG" \
              -t "dhole/dataextraction-workers:$SHA_TAG" .
          fi
          echo "Docker build: $(( $(date +%s) - START ))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy DataExtraction staging
        run: |
          set -euo pipefail
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" up -d --no-deps --force-recreate --pull never dataextraction-api dataextraction-workers
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" ps dataextraction-api dataextraction-workers
      - name: Cleanup old images
        run: docker image prune -f
