name: Deploy Dhole DataExtraction - Production

on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  packages: read
concurrency:
  group: dhole-dataextraction-production
  cancel-in-progress: false
env:
  COMPOSE_FILE: .dhole-system/deploy/docker-compose.services.yml
  DHOLE_IMAGE_TAG: latest
  DHOLE_NETWORK: dhole
  COMPOSE_PROJECT: dhole
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Skip superseded commits
        id: freshness
        run: |
          set -euo pipefail
          BRANCH_SHA="$(git ls-remote --heads origin "$GITHUB_REF_NAME" | awk '{print $1}')"
          if [ -z "$BRANCH_SHA" ]; then
            echo "::error::Cannot resolve current branch HEAD for $GITHUB_REF_NAME"
            exit 1
          fi
          if [ "$GITHUB_SHA" = "$BRANCH_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping outdated commit $GITHUB_SHA; current branch HEAD is $BRANCH_SHA"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Load Dhole deployment infrastructure
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          rm -rf .dhole-system
          git clone --depth 1 --branch master https://github.com/CustomCodeCR/DholeSystem.git .dhole-system
          test -r /opt/dhole/.env
          echo "DHOLE_ENV_FILE=/opt/dhole/.env" >> "$GITHUB_ENV"
      - name: Verify production server
        if: steps.freshness.outputs.deploy == 'true'
        run: docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" config -q
      - name: Run carrier pricing integrity regressions (cached)
        if: steps.freshness.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export NuGetPackageSourceCredentials_github="Username=${GITHUB_ACTOR};Password=${GITHUB_TOKEN};ValidAuthenticationTypes=Basic"
          # Persist NuGet packages across runs on the same self-hosted runner.
          # The container runs as the runner user so packages remain writable.
          NUGET_CACHE="${HOME}/.cache/dhole-dataextraction/nuget"
          mkdir -p "$NUGET_CACHE"
          START=$(date +%s)
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e DOTNET_CLI_HOME=/tmp \
            -e DOTNET_NOLOGO=1 \
            -e NUGET_PACKAGES=/tmp/nuget \
            -e NuGetPackageSourceCredentials_github \
            -v "$NUGET_CACHE:/tmp/nuget" \
            -v "$PWD:/src" \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            bash -lc 'dotnet restore tests/Dhole.DataExtraction.UnitTests/Dhole.DataExtraction.UnitTests.csproj --configfile NuGet.Config --verbosity quiet && dotnet test tests/Dhole.DataExtraction.UnitTests/Dhole.DataExtraction.UnitTests.csproj -c Release --no-restore --filter "FullyQualifiedName~CarrierEmailPricingIntegrityRegressionTests|FullyQualifiedName~DocumentOcrIntegrationTests|FullyQualifiedName~ExcelMultiSectionTariffTests" --verbosity quiet'
          echo "Regression tests: $(( $(date +%s) - START ))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Build API and Workers together (shared BuildKit cache)
        if: steps.freshness.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          START=$(date +%s)
          export GITHUB_ACTOR IMAGE_TAG="$DHOLE_IMAGE_TAG"
          if [ "$IMAGE_TAG" = "latest" ]; then
            export SHA_TAG="${GITHUB_SHA::12}"
          else
            export SHA_TAG="${IMAGE_TAG}-${GITHUB_SHA::12}"
          fi
          if docker buildx version >/dev/null 2>&1; then
            # BuildKit executes both final targets together and shares NuGet restore,
            # OCR runtime apt dependencies and cached project compilation layers.
            docker buildx bake -f .github/docker-bake.hcl --progress=plain
          else
            # Compatible fallback for runners where the Buildx CLI plugin is absent.
            docker build --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" \
              --secret id=github_token,env=GITHUB_TOKEN \
              -f .github/docker/Dockerfile --target api \
              -t "dhole/dataextraction-api:$IMAGE_TAG" \
              -t "dhole/dataextraction-api:$SHA_TAG" .
            docker build --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" \
              --secret id=github_token,env=GITHUB_TOKEN \
              -f .github/docker/Dockerfile --target workers \
              -t "dhole/dataextraction-workers:$IMAGE_TAG" \
              -t "dhole/dataextraction-workers:$SHA_TAG" .
          fi
          echo "Docker build: $(( $(date +%s) - START ))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy DataExtraction
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" up -d --no-deps --force-recreate --pull never dataextraction-api dataextraction-workers
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" ps dataextraction-api dataextraction-workers
      - name: Keep only master and develop branches
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          while IFS= read -r branch; do case "$branch" in master|develop) continue ;; esac; git push origin --delete "$branch"; done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$' || true)
      - name: Cleanup old images
        if: steps.freshness.outputs.deploy == 'true'
        run: docker image prune -f
