name: Apply legacy Excel attachment fix

on:
  push:
    branches: [master]
    paths:
      - .github/scripts/patch-parallel-file-extraction.py
      - .github/workflows/apply-parallel-extraction-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: python3 .github/scripts/patch-parallel-file-extraction.py

      - name: Test
        shell: bash
        run: dotnet test tests/Dhole.DataExtraction.UnitTests/Dhole.DataExtraction.UnitTests.csproj -c Release

      - name: Commit source fix and clean helper files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/scripts/patch-parallel-file-extraction.py .github/workflows/apply-parallel-extraction-fix.yml
          git add \
            src/Dhole.DataExtraction.Infrastructure/Pipeline/AutomatedPricingExtractionService.cs \
            src/Dhole.DataExtraction.Workers/Workers/EmailExtractionWorker.cs \
            src/Dhole.DataExtraction.Workers/Workers/LegacyEmailExtractionWorker.cs \
            src/Dhole.DataExtraction.Workers/Workers/LegacyExcelAiRecoveryWorker.cs \
            src/Dhole.DataExtraction.Workers/DependencyInjection/WorkerServiceCollectionExtensions.cs \
            tests/Dhole.DataExtraction.UnitTests/AutomatedPricingExtractionServiceTests.cs
          git diff --cached --check
          git commit -m "fix(email): support legacy Excel attachments end to end"
          git push origin HEAD:master
