name: Realtime F6.08 DataExtraction job invalidations (isolated)
on:
  push:
    branches: [feature/dhole-realtime-universal-rt-20261107-01]
    paths:
      - 'src/Dhole.DataExtraction.Persistence/DbContexts/ServiceDbContext.cs'
      - 'src/Dhole.DataExtraction.Api/Program.cs'
      - 'src/Dhole.DataExtraction.Api/Endpoints/RealtimeAccessEndpoints.cs'
      - 'src/Dhole.DataExtraction.Persistence/Messaging/DataExtractionRealtimeInvalidation.cs'
      - 'src/Dhole.DataExtraction.Workers/Outbox/OutboxProcessor.cs'
      - 'tests/Dhole.DataExtraction.IntegrationTests/F6DataExtractionRealtimeContractTests.cs'
      - 'version.json'
      - 'Directory.Build.targets'
      - 'CHANGELOG.md'
      - '.github/workflows/realtime-f6-dataextraction.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  realtime-dataextraction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate component and global release versions
        run: python3 scripts/verify_dhole_version.py
      - name: Authenticate package feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username github-actions --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile NuGet.Config
      - name: Restore DataExtraction tests and API
        run: dotnet restore tests/Dhole.DataExtraction.IntegrationTests/Dhole.DataExtraction.IntegrationTests.csproj --configfile NuGet.Config
      - name: Build DataExtraction API and tests
        run: dotnet build tests/Dhole.DataExtraction.IntegrationTests/Dhole.DataExtraction.IntegrationTests.csproj -c Release --no-restore
      - name: Build DataExtraction worker and Outbox routing
        run: dotnet build src/Dhole.DataExtraction.Workers/Dhole.DataExtraction.Workers.csproj -c Release
      - name: Test F6.08 event security and release gate
        run: dotnet test tests/Dhole.DataExtraction.IntegrationTests/Dhole.DataExtraction.IntegrationTests.csproj -c Release --no-build --filter FullyQualifiedName~F6DataExtractionRealtimeContractTests -- RunConfiguration.TreatNoTestsAsError=true
