name: Apply PlusCargo PDF header extraction v3

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-pluscargo-pdf-header-v3-20260829.yml'

permissions:
  contents: write
  packages: read

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply corrected PlusCargo patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/fix-pluscargo-pdf-header-20260829.yml').read_text()
          start = source.index('      - name: Patch PDF header extraction')
          end = source.index('      - name: Validate focused tests', start)
          block = source[start:end]
          marker = '        run: |\n'
          script = block.split(marker, 1)[1]
          lines = [line[10:] if line.startswith('          ') else line for line in script.splitlines()]
          Path('/tmp/apply-pluscargo-dataextraction.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-pluscargo-dataextraction.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Dhole.DataExtraction.Infrastructure/Extraction/Pdf/PdfDocumentExtractor.cs')
          text = path.read_text()
          old = '''                var values = new Dictionary<string, string?>(
                              row.Values,
                              StringComparer.OrdinalIgnoreCase
                          );'''
          new = '''                var values = row.Values.ToDictionary(
                              pair => pair.Key,
                              pair => pair.Value,
                              StringComparer.OrdinalIgnoreCase
                          );'''
          if old not in text:
              raise SystemExit('Dictionary correction anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Validate production compile
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="dhole/dataextraction-pluscargo-check:${GITHUB_RUN_ID}"
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.DataExtraction.Api/Dockerfile -t "$TAG" .
          docker image rm -f "$TAG" >/dev/null 2>&1 || true

      - name: Commit directly to master
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-pluscargo-pdf-header-20260829.yml
          rm -f .github/workflows/fix-pluscargo-pdf-header-v2-20260829.yml
          rm -f .github/workflows/fix-pluscargo-pdf-header-v3-20260829.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(dataextraction): propagate PlusCargo PDF header fields"
          git pull --rebase origin master
          git push origin HEAD:master
