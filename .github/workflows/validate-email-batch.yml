name: Validate email batch pipeline

on:
  pull_request:
    branches: [develop, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'VERSION'
      - 'CHANGELOG.md'
      - '.github/workflows/validate-email-batch.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  compile-test-and-version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate release version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          import re
          version=Path('VERSION').read_text().strip()
          assert re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', version), version
          props=ElementTree.parse('Directory.Build.props').getroot()
          versions=[n.text for n in props.iter('Version')]
          assert version in versions, (version,versions)
          assert f'[{version}]' in Path('CHANGELOG.md').read_text(), 'Missing release changelog'
          print(f'SemVer verified: {version}')
          PY
      - name: Restore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export NuGetPackageSourceCredentials_github="Username=${GITHUB_ACTOR};Password=${GITHUB_TOKEN};ValidAuthenticationTypes=Basic"
          dotnet restore tests/Dhole.DataExtraction.UnitTests/Dhole.DataExtraction.UnitTests.csproj --configfile NuGet.Config
      - name: Compile and test
        run: dotnet test tests/Dhole.DataExtraction.UnitTests/Dhole.DataExtraction.UnitTests.csproj -c Release --no-restore --logger "console;verbosity=normal"
