name: Validate Average Competitor PDFs

on:
  push:
    branches:
      - feature/average-competitor-fcl-pdfs-oct2026
  pull_request:
    branches: [develop, master]
    paths:
      - 'src/Dhole.DataExtraction.Infrastructure/Extraction/Pdf/**'
      - 'src/Dhole.DataExtraction.Infrastructure/Pipeline/PricingDocumentDefaultsEnricher.cs'
      - 'tests/Dhole.DataExtraction.UnitTests/**'
      - '.github/workflows/validate-average-competitor-pdfs.yml'

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore unit tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export NuGetPackageSourceCredentials_github="Username=${GITHUB_ACTOR};Password=${GITHUB_TOKEN};ValidAuthenticationTypes=Basic"
          dotnet restore tests/Dhole.DataExtraction.UnitTests/Dhole.DataExtraction.UnitTests.csproj --configfile NuGet.Config
      - name: Verify six competitor PDF layouts
        run: dotnet test tests/Dhole.DataExtraction.UnitTests/Dhole.DataExtraction.UnitTests.csproj -c Release --no-restore --filter "FullyQualifiedName~CompetitorFclPdfParserTests" --verbosity normal
      - name: Regression suite
        run: dotnet test tests/Dhole.DataExtraction.UnitTests/Dhole.DataExtraction.UnitTests.csproj -c Release --no-restore --verbosity quiet
