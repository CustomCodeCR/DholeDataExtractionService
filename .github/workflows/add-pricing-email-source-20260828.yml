name: Add pricing email source lookup
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/add-pricing-email-source-20260828.yml'
permissions:
  contents: write
  packages: read
jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source lookup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Dhole.DataExtraction.Api/Endpoints/Emails/EmailIngestionEndpoints.cs')
          text = path.read_text(encoding='utf-8-sig')
          needle = '''        group.MapGet("/messages/{id:guid}", async (\n'''
          insert = '''        group.MapGet("/pricing-imports/{pricingImportBatchId:guid}/source", async (\n            Guid pricingImportBatchId,\n            ServiceDbContext dbContext,\n            CancellationToken cancellationToken\n        ) =>\n        {\n            var job = await dbContext.EmailExtractionJobs.AsNoTracking()\n                .Where(x => x.PricingImportBatchId == pricingImportBatchId && !x.IsDeleted)\n                .OrderByDescending(x => x.CreatedAtUtc)\n                .FirstOrDefaultAsync(cancellationToken);\n\n            if (job is null)\n            {\n                return Results.NotFound(new\n                {\n                    code = "DataExtraction.PricingImportEmailSourceNotFound",\n                    message = "No se encontró el correo fuente de esta importación de Pricing.",\n                });\n            }\n\n            var message = await dbContext.EmailMessages.AsNoTracking()\n                .FirstOrDefaultAsync(x => x.Id == job.EmailMessageId && !x.IsDeleted, cancellationToken);\n            if (message is null)\n            {\n                return Results.NotFound(new\n                {\n                    code = "DataExtraction.EmailMessageNotFound",\n                    message = "No se encontró el correo fuente asociado a la importación.",\n                });\n            }\n\n            var attachment = job.EmailAttachmentId.HasValue\n                ? await dbContext.EmailAttachments.AsNoTracking()\n                    .FirstOrDefaultAsync(x => x.Id == job.EmailAttachmentId.Value && !x.IsDeleted, cancellationToken)\n                : null;\n\n            return Results.Ok(new\n            {\n                pricingImportBatchId,\n                emailMessageId = message.Id,\n                emailAttachmentId = job.EmailAttachmentId,\n                sourceType = job.SourceType.ToString(),\n                subject = message.Subject,\n                message.FromName,\n                message.FromAddress,\n                originalFileName = attachment?.FileName,\n                attachmentStoragePath = attachment?.StoragePath,\n                rawEmailStoragePath = message.RawEmailStoragePath,\n                message.ReceivedAt,\n            });\n        });\n\n        group.MapGet("/messages/{id:guid}", async (\n'''
          if needle not in text:
              raise SystemExit('messages route anchor not found')
          if '/pricing-imports/{pricingImportBatchId:guid}/source' not in text:
              text = text.replace(needle, insert, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker build --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.DataExtraction.Api/Dockerfile -t dhole/dataextraction-source-validation .
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/add-pricing-email-source-20260828.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(email): expose source by pricing import batch"
          git push origin HEAD:master
