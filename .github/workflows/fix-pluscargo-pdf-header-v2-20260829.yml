name: Apply PlusCargo PDF header extraction v2

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-pluscargo-pdf-header-v2-20260829.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse and apply validated patch script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/fix-pluscargo-pdf-header-20260829.yml').read_text()
          start = source.index('      - name: Patch PDF header extraction')
          end = source.index('      - name: Validate focused tests', start)
          block = source[start:end]
          marker = '        run: |\n'
          script = block.split(marker, 1)[1]
          lines = []
          for line in script.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-pluscargo-dataextraction.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-pluscargo-dataextraction.sh
          git diff --check

      - name: Commit directly to master
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-pluscargo-pdf-header-20260829.yml
          rm -f .github/workflows/fix-pluscargo-pdf-header-v2-20260829.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(dataextraction): propagate PlusCargo PDF header fields"
          git push origin HEAD:master
